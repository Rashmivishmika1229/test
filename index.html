<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="post-card">

    <div class="profile">
        <img src="https://i.pravatar.cc/100?img=12" alt="Profile">
        <div>
            <h3>sAvi</h3>
            <p>2 hrs ago</p>
        </div>
    </div>

    <div class="caption">
        <p>🌴 Enjoying an amazing vacation! Beautiful weather and unforgettable memories.</p>
    </div>

    <img class="post-image"
         src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
         alt="Post Image">

    <div class="actions">
        <button id="likeBtn">Like</button>
        <span id="likeCount">0 Likes</span>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
